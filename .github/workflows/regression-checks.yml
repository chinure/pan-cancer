name: targeted-regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("BiocManager", "dplyr", "tidyr", "readxl", "openxlsx"), repos="https://cloud.r-project.org"); BiocManager::install("limma", ask=FALSE, update=FALSE)'
      - run: Rscript tests/regression-limma-contrast.R
      - run: Rscript tests/regression-legacy-helpers.R
      - run: Rscript tests/preflight-paths.R
